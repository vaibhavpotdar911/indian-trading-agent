name: Autonomous AI Developer Agent

on:
  repository_dispatch:
    types: [jira_ticket_assigned]

jobs:
  build-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Antigravity SDK & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-antigravity composio-core

      - name: Execute Antigravity Agent
        env:
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_ISSUE_KEY: ${{ github.event.client_payload.issue_key }}
        run: |
          python - << 'EOF'
          import os
          import asyncio
          from google.antigravity import Agent, AgentConfig

          async def main():
              issue_key = os.environ.get("JIRA_ISSUE_KEY", "KAN-1")
              print(f"Processing Jira Ticket: {issue_key}")

              # Pass proper Pydantic AgentConfig object
              config = AgentConfig(
                  api_key=os.environ.get("ANTIGRAVITY_API_KEY"),
                  jira_token=os.environ.get("JIRA_API_TOKEN"),
                  jira_email=os.environ.get("JIRA_EMAIL"),
                  jira_domain=os.environ.get("JIRA_DOMAIN")
              )

              async with Agent(config) as agent:
                  prompt = f"""
                  Fetch details for Jira ticket {issue_key}.
                  1. Create a git branch named 'feature/{issue_key}'.
                  2. Write/modify code according to acceptance criteria.
                  3. Run tests using 'npm test' or 'pytest'.
                  4. Push branch and open a Pull Request to 'main'.
                  5. Comment on Jira ticket {issue_key} with the PR link and status.
                  6. Transition ticket to 'In Review'.
                  """
                  await agent.run(prompt)

          if __name__ == "__main__":
              asyncio.run(main())
          EOF

      - name: Commit and Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Antigravity-AI-Bot"
          git config --global user.email "bot@antigravity.ai"
          git push origin HEAD --force
          gh pr create --title "Fix for ${{ github.event.client_payload.issue_key }}" --body "Automated PR generated by Antigravity Agent." || true
